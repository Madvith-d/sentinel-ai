name: Bun CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run --cwd packages/remediator typecheck
      - run: bun run --cwd packages/notifier typecheck
      - run: bun run --cwd apps/sample lint
      - run: bun run --cwd apps/sample typecheck
      - run: bun run --cwd apps/sample build
      - run: bun run --cwd apps/dashboard build
