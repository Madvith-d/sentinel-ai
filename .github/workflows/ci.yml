name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'

      - name: Setup Node (Next.js build runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck controller
        run: bun run --cwd apps/controller typecheck

      - name: Typecheck sample
        run: bun run --cwd apps/sample typecheck

      - name: Typecheck dashboard
        run: bun run --cwd apps/dashboard typecheck

      - name: Typecheck notifier
        run: bun run --cwd packages/notifier typecheck

      - name: Typecheck remediator
        run: bun run --cwd packages/remediator typecheck

      - name: Test controller
        run: bun run --cwd apps/controller test

      - name: Test sample
        run: bun run --cwd apps/sample test

      - name: Test dashboard
        run: bun run --cwd apps/dashboard test

      - name: Test notifier
        run: bun run --cwd packages/notifier test

      - name: Test remediator
        run: bun run --cwd packages/remediator test

      - name: Lint sample
        run: bun run --cwd apps/sample lint

      - name: Build dashboard
        run: bun run --cwd apps/dashboard build

      - name: Build sample
        run: bun run --cwd apps/sample build
